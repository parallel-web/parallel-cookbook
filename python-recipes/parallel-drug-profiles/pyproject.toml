[project]
name = "parallel-drug-profiles"
version = "0.1.0"
description = "Cited drug asset profiles for a CSV of drugs, researched with the Parallel Task API and its free healthcare data connectors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "parallel-web>=1.3.7",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "jinja2>=3.1",
  "weasyprint>=62",
]

[dependency-groups]
dev = [
    "pypdf>=7.1.0",
]
